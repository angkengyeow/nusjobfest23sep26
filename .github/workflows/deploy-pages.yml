name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute base path
        id: base
        run: |
          if [ "${GITHUB_REPOSITORY}" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site
        run: bun run build:gh
        env:
          GH_PAGES_BUILD: "1"
          GH_PAGES_BASE: ${{ steps.base.outputs.path }}
          NODE_OPTIONS: "--max-old-space-size=4608"

      - name: Prepare Pages output
        run: |
          OUT=dist/client
          echo "--- contents of $OUT"
          ls -la "$OUT" || true
          if [ -f "$OUT/_shell.html" ]; then
            SHELL_FILE="$OUT/_shell.html"
          elif [ -f "$OUT/index.html" ]; then
            SHELL_FILE="$OUT/index.html"
          else
            SHELL_FILE="$(find "$OUT" -maxdepth 2 -name '*.html' | head -n1)"
          fi
          if [ -z "$SHELL_FILE" ]; then
            echo "No HTML shell produced by the build"; exit 1
          fi
          echo "Using shell: $SHELL_FILE"
          cp "$SHELL_FILE" "$OUT/index.html"
          cp "$SHELL_FILE" "$OUT/404.html"
          touch "$OUT/.nojekyll"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
