name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute base path
        id: base
        run: |
          if [ "${GITHUB_REPOSITORY}" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site
        run: bun run build:gh
        env:
          GH_PAGES_BUILD: "1"
          GH_PAGES_BASE: ${{ steps.base.outputs.path }}
          NODE_OPTIONS: "--max-old-space-size=4608"

      - name: Prepare Pages output
        run: |
          SHELL_FILE="$(find . -path './node_modules' -prune -o -type f -name '_shell.html' -print -quit)"
          if [ -z "$SHELL_FILE" ]; then
            SHELL_FILE="$(find . -path './node_modules' -prune -o -type f \( -path '*/client/index.html' -o -path '*/public/index.html' \) -print -quit)"
          fi
          if [ -z "$SHELL_FILE" ]; then
            echo "No HTML shell produced by the build"
            find . -path './node_modules' -prune -o -maxdepth 4 -type f -print | sort
            exit 1
          fi
          echo "Using shell: $SHELL_FILE"
          SOURCE_DIR="$(dirname "$SHELL_FILE")"
          mkdir -p pages-dist
          cp -a "$SOURCE_DIR"/. pages-dist/
          cp "$SHELL_FILE" pages-dist/index.html
          cp "$SHELL_FILE" pages-dist/404.html
          touch pages-dist/.nojekyll
          ls -la pages-dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
